version: "3"

vars:
  GO_CACHE: '{{.GO_CACHE | default "/tmp/xira-go-build"}}'
  GO_PATH: '{{.GO_PATH | default "/tmp/xira-go"}}'
  CONFIG: '{{.CONFIG | default "xira.yaml"}}'
  BIN_DIR: '{{.BIN_DIR | default "bin"}}'
  BIN: '{{.BIN | default "bin/xira"}}'
  AGENT: '{{.AGENT | default ""}}'
  MSG: '{{.MSG | default "hello xira"}}'
  VERSION:
    sh: |
      version=$(awk -F '"' '/^[[:space:]]*Version[[:space:]]*=/ { print $2; exit }' apps/xira/internal/version/version.go)
      test -n "$version"
      printf '%s\n' "$version"
  COMMIT:
    sh: git rev-parse --short HEAD
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  METADATA_LDFLAGS: '-X github.com/xiramesh/xira/internal/version.Version={{.VERSION}} -X github.com/xiramesh/xira/internal/version.Commit={{.COMMIT}} -X github.com/xiramesh/xira/internal/version.Date={{.BUILD_DATE}}'
  LDFLAGS: '-s -w {{.METADATA_LDFLAGS}}'

env:
  GOCACHE: "{{.GO_CACHE}}"
  GOPATH: "{{.GO_PATH}}"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  tidy:
    desc: Tidy Go module dependencies
    cmds:
      - go -C apps/xira mod tidy

  fmt:
    desc: Format Go source
    cmds:
      - gofmt -w apps/xira/cmd apps/xira/internal

  test:
    desc: Run all Go tests
    cmds:
      - ./scripts/test-taskfile-clean.sh
      - ./scripts/test-taskfile-build-metadata.sh
      - go test ./apps/xira/...

  check:
    desc: Format and run tests
    cmds:
      - task: fmt
      - task: test

  build:
    desc: Build Xira binary with debug symbols
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -ldflags="{{.METADATA_LDFLAGS}}" -o {{.BIN}} ./apps/xira/cmd/xira

  build:prod:
    desc: Build stripped Xira production binary
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -trimpath -ldflags="{{.LDFLAGS}}" -o {{.BIN}} ./apps/xira/cmd/xira

  build:linux:
    desc: Build stripped Xira Linux amd64 binary
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="{{.LDFLAGS}}" -o {{.BIN_DIR}}/xira-linux-amd64 ./apps/xira/cmd/xira

  build:windows:
    desc: Build stripped Xira Windows amd64 executable
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="{{.LDFLAGS}}" -o {{.BIN_DIR}}/xira-windows-amd64.exe ./apps/xira/cmd/xira

  version:
    desc: Print Xira version
    cmds:
      - go run ./apps/xira/cmd/xira version

  serve:
    desc: Run the Xira runtime API server
    cmds:
      - go run ./apps/xira/cmd/xira --config {{.CONFIG}} serve

  agent:list:
    desc: List agent profiles
    cmds:
      - go run ./apps/xira/cmd/xira --config {{.CONFIG}} agent list

  agent:run:
    desc: Run an agent once; override with MSG='...' and AGENT='...'
    cmds:
      - go run ./apps/xira/cmd/xira --config {{.CONFIG}} agent run {{if .AGENT}}--agent {{.AGENT}} {{end}}--message {{quote .MSG}}

  runs:list:
    desc: List recorded runs
    cmds:
      - go run ./apps/xira/cmd/xira --config {{.CONFIG}} runs list

  smoke:
    desc: Run a non-interactive DeepSeek smoke test
    cmds:
      - go run ./apps/xira/cmd/xira version
      - go run ./apps/xira/cmd/xira --config {{.CONFIG}} agent run --message "please call command"
      - test -d workspace/.xira/runs

  live-test:
    desc: Run live LLM tests (requires DEEPSEEK_API_KEY file + sets XIRA_DEEPSEEK_LIVE=1). Fails if any test SKIPs — catches the "静默绿" hazard (AGENTS.md §5.3).
    cmds:
      - |
        if [ ! -f DEEPSEEK_API_KEY ]; then
          echo "ERROR: DEEPSEEK_API_KEY file not found in repo root (see AGENTS.md §5.3)"; exit 1
        fi
        export DEEPSEEK_API_KEY="$(cat DEEPSEEK_API_KEY)"
        export XIRA_DEEPSEEK_LIVE=1
        if go test ./apps/xira/... -v -count=1 > /tmp/xira-live-test.log 2>&1; then
          cat /tmp/xira-live-test.log
        else
          status=$?
          cat /tmp/xira-live-test.log
          exit "$status"
        fi
        # Check for live-test skips specifically — a live test that SKIPped
        # under the double-gate (key present + LIVE=1) means it didn't run.
        # Platform-related skips (case-sensitive FS etc.) are NOT live-gated
        # and are allowed.
        if grep -q 'SKIP.*XIRA_DEEPSEEK_LIVE\|SKIP.*DEEPSEEK_API_KEY' /tmp/xira-live-test.log; then
          echo "ERROR: live tests were SKIPPED despite double-gate being set — they did not run (AGENTS.md §5.3)"; exit 1
        fi

  clean:
    desc: Remove local Xira run/cache output
    cmds:
      - GOPATH="/tmp/xira-go" go clean -modcache
      - rm -rf .xira workspace/.xira .cache /tmp/xira-go-build /tmp/xira-go /tmp/xira-smoke-runs /tmp/xira-task-smoke-runs
