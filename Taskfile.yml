version: "3"

vars:
  GO_CACHE: '{{.GO_CACHE | default "/tmp/xira-go-build"}}'
  GO_PATH: '{{.GO_PATH | default "/tmp/xira-go"}}'
  CONFIG: '{{.CONFIG | default "xira.yaml"}}'
  BIN_DIR: '{{.BIN_DIR | default "bin"}}'
  BIN: '{{.BIN | default "bin/xira"}}'
  AGENT: '{{.AGENT | default ""}}'
  MSG: '{{.MSG | default "hello xira"}}'

env:
  GOCACHE: "{{.GO_CACHE}}"
  GOPATH: "{{.GO_PATH}}"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  tidy:
    desc: Tidy Go module dependencies
    cmds:
      - go -C apps/xira mod tidy

  fmt:
    desc: Format Go source
    cmds:
      - gofmt -w apps/xira/cmd apps/xira/internal

  test:
    desc: Run all Go tests
    cmds:
      - go test ./apps/xira/...

  check:
    desc: Format and run tests
    cmds:
      - task: fmt
      - task: test

  build:
    desc: Build Xira binary with debug symbols
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN}} ./apps/xira/cmd/xira

  build:prod:
    desc: Build stripped Xira production binary
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -trimpath -ldflags="-s -w" -o {{.BIN}} ./apps/xira/cmd/xira

  build:linux:
    desc: Build stripped Xira Linux amd64 binary
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o {{.BIN_DIR}}/xira-linux-amd64 ./apps/xira/cmd/xira

  build:windows:
    desc: Build stripped Xira Windows amd64 executable
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o {{.BIN_DIR}}/xira-windows-amd64.exe ./apps/xira/cmd/xira

  version:
    desc: Print Xira version
    cmds:
      - go run ./apps/xira/cmd/xira version

  serve:
    desc: Run the Xira runtime API server
    cmds:
      - go run ./apps/xira/cmd/xira --config {{.CONFIG}} serve

  agent:list:
    desc: List agent profiles
    cmds:
      - go run ./apps/xira/cmd/xira --config {{.CONFIG}} agent list

  agent:run:
    desc: Run an agent once; override with MSG='...' and AGENT='...'
    cmds:
      - go run ./apps/xira/cmd/xira --config {{.CONFIG}} agent run {{if .AGENT}}--agent {{.AGENT}} {{end}}--message {{quote .MSG}}

  runs:list:
    desc: List recorded runs
    cmds:
      - go run ./apps/xira/cmd/xira --config {{.CONFIG}} runs list

  smoke:
    desc: Run a non-interactive DeepSeek smoke test
    cmds:
      - go run ./apps/xira/cmd/xira version
      - go run ./apps/xira/cmd/xira --config {{.CONFIG}} agent run --message "please call command"
      - test -d workspace/.xira/runs

  clean:
    desc: Remove local Xira run/cache output
    cmds:
      - rm -rf .xira workspace/.xira .cache /tmp/xira-go-build /tmp/xira-smoke-runs /tmp/xira-task-smoke-runs
